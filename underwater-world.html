<title>Deep Reef — Explorable Underwater World</title>
<!--
  DEEP REEF — a procedural, explorable underwater world.
  Single file. Three.js (r160) from CDN. No external models, textures or sounds:
  every mesh, texture and sound is generated in code below.

  Code map (search for "=== n."):
   1. Config & adaptive quality      8. Marine life
   2. Math / noise utilities         9. Shipwreck (the "wow" location)
   3. Renderer, scene, lights       10. Whale skeleton, trail, bubbles
   4. Shared shader patches         11. Audio (Web Audio API)
   5. Procedural textures           12. Controls (keyboard / mouse / touch)
   6. Terrain, rocks, debris        13. Cinematic tour
   7. Kelp & coral                  14. UI + main loop
-->
<style>

#start{margin-top:36px;padding:17px 46px 17px 52px;border-radius:999px;border:1px solid rgba(220,250,255,.6);background:rgba(200,240,250,.1);color:var(--ink);font-size:15px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .3s,transform .3s,box-shadow .3s,opacity .3s;box-shadow:0 0 50px rgba(120,220,240,.18)}

<div id="title">
  <div class="eyebrow">Interactive Demo</div>
  <h1>DEEP REEF</h1>

<script type="module">
import * as THREE from 'three';
const V3 = THREE.Vector3;

/* =====================================================================
   === 1. Config & adaptive quality
   ===================================================================== */
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');
const IS_TOUCH = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && navigator.maxTouchPoints > 0);
const IS_MOBILE = IS_TOUCH && Math.min(screen.width, screen.height) < 900;
const TIERS = {
  high: { pr: Math.min(devicePixelRatio, 2),   aa: true,  shadows: true,  shadowSize: 2048, terrainSeg: 230, rockDetail: 9, kelp: 150, silver: 480, life: 1.0, coral: 1.0, snow: 4500, jelly: 12 },
  low:  { pr: Math.min(devicePixelRatio, 1.5), aa: false, shadows: false, shadowSize: 1024, terrainSeg: 150, rockDetail: 6, kelp: 75,  silver: 240, life: 0.55, coral: 0.6, snow: 1800, jelly: 7 },
};
const TIER = TIERS[params.get('q')] ? params.get('q') : (IS_MOBILE ? 'low' : 'high');
const Q = TIERS[TIER];

// Palette (sRGB hex). Colours are deliberately desaturated: water absorbs red first.
const PAL = {
  fog: '#0b4a5e', domeTop: '#3f9db4', domeDeep: '#021821',
  sun: '#d4f0ee', hemiSky: '#5aa9bf', hemiGround: '#46574c',
  sand: '#bcae88', sand2: '#9d9373', kelpGround: '#7b7459', rock: '#555b58', rock2: '#3d4542', algae: '#55623d',
  kelpBase: '#3d3e1e', kelpTop: '#86702f', wood: '#75695a', wood2: '#8a7d68', woodAlgae: '#6c7752',
  bone: '#b3ab96', glow: '#7fe3d4',
};
const SUN_DIR = new V3(0.32, 1, 0.22).normalize();

/* =====================================================================
   === 2. Math / noise utilities
   ===================================================================== */
let _seed = 20261117;
function rand() { _seed = (_seed + 0x6D2B79F5) | 0; let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);
const fadeC = t => t * t * (3 - 2 * t);
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function hash3(x, y, z) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(z | 0, 1440670441)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), u = fadeC(x - xi), v = fadeC(y - yi);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm2(x, y, o = 4) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * noise2(x, y); n += a; x = x * 2.03 + 17.1; y = y * 2.03 - 9.3; a *= 0.5; } return s / n; }
function noise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = fadeC(x - xi), v = fadeC(y - yi), w = fadeC(z - zi);
  const l = (a, b, t) => a + (b - a) * t;
  const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
  return l(l(l(c(0,0,0), c(1,0,0), u), l(c(0,1,0), c(1,1,0), u), v), l(l(c(0,0,1), c(1,0,1), u), l(c(0,1,1), c(1,1,1), u), v), w);
}
function fbm3(x, y, z, o = 4) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * noise3(x, y, z); n += a; x *= 2.02; y *= 2.02; z *= 2.02; a *= 0.5; } return s / n; }
// periodic noise for tileable textures
function pnoise(x, y, px, py) {
  const xi = Math.floor(x), yi = Math.floor(y), u = fadeC(x - xi), v = fadeC(y - yi);
  const wx = a => ((a % px) + px) % px, wy = a => ((a % py) + py) % py;
  const a = hash2(wx(xi), wy(yi)), b = hash2(wx(xi + 1), wy(yi)), c = hash2(wx(xi), wy(yi + 1)), d = hash2(wx(xi + 1), wy(yi + 1));
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function pfbm(x, y, o, px, py = px) { let s = 0, a = 0.5, n = 0; for (let i = 0; i < o; i++) { s += a * pnoise(x, y, px, py); n += a; x *= 2; y *= 2; px *= 2; py *= 2; a *= 0.5; } return s / n; }

// --- World layout (metres). Surface is y = 0, seabed ~ -20 m.
const SITE = { kelp: { x: -30, z: -36 }, reef: { x: 32, z: -6 }, clearing: { x: 0, z: 6 }, wreck: { x: 6, z: 42 }, whale: { x: -15, z: 33 } };
const reefMask = (x, z) => 1 - sstep(8, 30, Math.hypot(x - SITE.reef.x, (z - SITE.reef.z) * 1.2));
const kelpMask = (x, z) => 1 - sstep(6, 32, Math.hypot(x - SITE.kelp.x, z - SITE.kelp.z));
/** Seabed height at (x,z). Used for the terrain mesh, object placement and collision. */
function ground(x, z) {
  let y = -20 + (fbm2(x * 0.011 + 3.1, z * 0.011 - 7.7, 4) - 0.5) * 6;
  y += Math.sin(x * 0.07 + z * 0.045 + fbm2(x * 0.025, z * 0.025, 2) * 5) * 0.45;           // long dunes
  const reef = reefMask(x, z);
  if (reef > 0) y += reef * (2.2 + (1 - Math.abs(fbm2(x * 0.05 + 5, z * 0.05 + 1, 3) * 2 - 1)) * 3.5);
  const kelp = kelpMask(x, z);
  if (kelp > 0) y += kelp * ((fbm2(x * 0.06, z * 0.06, 3) - 0.4) * 2.5 + 1.0);
  const c = 1 - sstep(6, 28, Math.hypot(x - SITE.clearing.x, z - SITE.clearing.z));
  y += (-20.6 - y) * c * 0.6;                                                                   // flat sandy clearing
  const w = 1 - sstep(8, 22, Math.hypot(x - SITE.wreck.x, z - SITE.wreck.z));
  y += (-20.2 - y) * w * 0.7;                                                                   // wreck rests on a sand bank
  y -= sstep(105, 175, Math.hypot(x, z)) * 16;                                                  // drop-off into the blue
  return y;
}

// --- geometry helpers
const _c = new THREE.Color();
function paint(geo, c) {
  if (geo.index) geo = geo.toNonIndexed();
  const p = geo.attributes.position, n = p.count, arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    if (typeof c === 'function') c(_c, p.getX(i), p.getY(i), p.getZ(i)); else _c.copy(c);
    arr[i * 3] = _c.r; arr[i * 3 + 1] = _c.g; arr[i * 3 + 2] = _c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}
function merge(geos) {
  let n = 0; geos = geos.map(g => (g.index ? g.toNonIndexed() : g)); for (const g of geos) n += g.attributes.position.count;
  const P = new Float32Array(n * 3), N = new Float32Array(n * 3), UV = new Float32Array(n * 2), C = new Float32Array(n * 3);
  const F = geos.some(g => g.attributes.aFlut) ? new Float32Array(n) : null;   // optional per-vertex flutter weight (kelp)
  let o = 0;
  for (const g of geos) {
    const c = g.attributes.position.count;
    P.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) N.set(g.attributes.normal.array, o * 3);
    if (g.attributes.uv) UV.set(g.attributes.uv.array, o * 2);
    if (g.attributes.color) C.set(g.attributes.color.array, o * 3); else C.fill(1, o * 3, (o + c) * 3);
    if (F && g.attributes.aFlut) F.set(g.attributes.aFlut.array, o);
    o += c; g.dispose();
  }
  const out = new THREE.BufferGeometry();
  if (F) out.setAttribute('aFlut', new THREE.BufferAttribute(F, 1));
  out.setAttribute('position', new THREE.BufferAttribute(P, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(UV, 2));
  out.setAttribute('color', new THREE.BufferAttribute(C, 3));
  out.computeBoundingSphere();
  return out;
}
/** Weld duplicated vertices so displaced shapes get smooth normals. */
function weld(geo) {
  const p = geo.attributes.position, map = new Map(), verts = [], idx = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const key = Math.round(x * 1e4) + '_' + Math.round(y * 1e4) + '_' + Math.round(z * 1e4);
    let k = map.get(key); if (k === undefined) { k = verts.length / 3; map.set(key, k); verts.push(x, y, z); }
    idx.push(k);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)); g.setIndex(idx);
  return g;
}
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _s = new V3();
function mat4(pos, rotY = 0, scale = 1, rotX = 0, rotZ = 0) {
  _e.set(rotX, rotY, rotZ, 'YXZ'); _q.setFromEuler(_e);
  if (typeof scale === 'number') _s.set(scale, scale, scale); else _s.copy(scale);
  return new THREE.Matrix4().compose(pos, _q, _s);
}
const _bx = new V3(), _by = new V3(), _bz = new V3(), UP = new V3(0, 1, 0);
/** Matrix whose local +Z faces `dir` (used for every swimming animal). */
function orient(m, pos, dir, s) {
  _bz.copy(dir); _bz.y = clamp(_bz.y, -0.6, 0.6); _bz.normalize();
  _bx.crossVectors(UP, _bz); if (_bx.lengthSq() < 1e-6) _bx.set(1, 0, 0); _bx.normalize();
  _by.crossVectors(_bz, _bx);
  m.makeBasis(_bx.multiplyScalar(s), _by.multiplyScalar(s), _bz.multiplyScalar(s));
  m.setPosition(pos);
  return m;
}

/* =====================================================================
   === 3. Renderer, scene, lights
   ===================================================================== */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: Q.aa, powerPreference: 'high-performance' });
} catch (e) {
  const el = document.getElementById('err'); el.style.display = 'flex';
  el.textContent = 'This experience needs WebGL. Please open it in a recent version of Chrome, Safari, Edge or Firefox.';
  throw e;
}
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;              // casters are toggled per tier via sun.castShadow
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(PAL.fog, 0.019);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.1, 420);
camera.rotation.order = 'YXZ';

const hemi = new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGround, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(PAL.sun, 2.3);
sun.castShadow = Q.shadows;
sun.shadow.mapSize.set(Q.shadowSize, Q.shadowSize);
Object.assign(sun.shadow.camera, { left: -42, right: 42, top: 42, bottom: -42, near: 1, far: 140 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

const U = { uTime: { value: 0 } };   // shared time uniform for every animated shader

/* =====================================================================
   === 4. Shared shader patches
   ===================================================================== */
// Wavelength-dependent extinction: red is absorbed fastest, so distant objects shift
// to blue-green before they vanish into the fog colour. Replaces three's fog for all materials.
THREE.ShaderChunk.fog_fragment = /* glsl */`
#ifdef USE_FOG
  #ifdef FOG_EXP2
    vec3 fogExt = fogDensity * vec3(1.6, 1.0, 0.86);
    vec3 fogT = exp( - fogExt * fogExt * vFogDepth * vFogDepth );
  #else
    vec3 fogT = vec3( 1.0 - smoothstep( fogNear, fogFar, vFogDepth ) );
  #endif
  gl_FragColor.rgb = fogColor + ( gl_FragColor.rgb - fogColor ) * fogT;
#endif`;

// Animated caustics (two layers of animated Voronoi edges) + depth absorption.
const CAUSTIC_GLSL = /* glsl */`
uniform float uTime; uniform float uCaus;
varying vec3 vWPos; varying vec3 vWNrm;
vec2 cHash(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }
float cVoro(vec2 p, float t){
  vec2 n = floor(p), f = fract(p); float d1 = 8.0, d2 = 8.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g = vec2(float(i), float(j)); vec2 o = cHash(n+g); o = 0.5 + 0.42*sin(t + 6.2831*o);
    vec2 r = g + o - f; float d = dot(r,r);
    if(d < d1){ d2 = d1; d1 = d; } else if(d < d2){ d2 = d; }
  }
  return sqrt(d2) - sqrt(d1);
}
float causticF(vec2 p, float t){
  p += 0.35*vec2(sin(p.y*0.9 + t*0.4), sin(p.x*0.8 - t*0.35));
  float a = cVoro(p, t);
  float b = cVoro(p*1.63 + 4.1, t*1.27);
  return pow(1.0 - smoothstep(0.0, 0.22, a), 3.0) + 0.55*pow(1.0 - smoothstep(0.0, 0.18, b), 3.0);
}`;
function addCaustics(sh, strength) {
  sh.uniforms.uTime = U.uTime; sh.uniforms.uCaus = { value: strength };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos; varying vec3 vWNrm;')
    .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      vec4 cwp = vec4(transformed, 1.0);
      vec3 cn = objectNormal;

// Sand: wind-free current ripples with warped crests, grain and the odd shell speck (tileable).
const sandTex = canvasTex(IS_MOBILE ? 256 : 512, (u, v, x, y, o) => {
  const warp = pfbm(u * 4, v * 4, 4, 4) * 5.0;
  const rip = Math.sin((u * 7 + v * 2) * Math.PI * 2 + warp);

// Aged wood: grain, rot streaks and worm holes (grain runs along U).

// Giant-kelp plant: several stipes of different ages; long ruffled blades on short stalks that

const CURRENT = new V3(0.85, 0, 0.45).normalize();

  }

}

/** Ray body: manta (pointed swept wings + cephalic fins) or stingray (round disc). Forward = +Z. */

  const nu = 26, nv = 10, P = [], C = [], I = [], T = new THREE.Color(top), c = new THREE.Color();
  for (let i = 0; i <= nu; i++) {

  const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { vert.v = v; b.setPointerCapture(e.pointerId); });
  b.addEventListener('pointerup', () => vert.v = 0); b.addEventListener('pointercancel', () => vert.v = 0);
}
const _fwd = new V3(), _right = new V3(), _wish = new V3();
function updatePlayer(dt, t) {
  player.yaw += (player.tYaw - player.yaw) * damp(12, dt);
  player.pitch += (player.tPitch - player.pitch) * damp(12, dt);
  const k = c => keys.has(c) ? 1 : 0;
  player.tYaw += (k('ArrowLeft') - k('ArrowRight')) * 1.4 * dt;
  const cp = Math.cos(player.pitch);
  _fwd.set(-Math.sin(player.yaw) * cp, Math.sin(player.pitch), -Math.cos(player.yaw) * cp);
  _right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const f = k('KeyW') + k('ArrowUp') - k('KeyS') - k('ArrowDown') + joy.y, r = k('KeyD') - k('KeyA') + joy.x;
  const u = k('Space') + k('KeyE') - k('ShiftLeft') - k('ShiftRight') - k('KeyQ') - k('KeyC') + vert.v;
  _wish.copy(_fwd).multiplyScalar(f).addScaledVector(_right, r).addScaledVector(UP, u);
  if (_wish.lengthSq() > 1) _wish.normalize();
  _wish.multiplyScalar(4.5);
  player.vel.lerp(_wish, damp(_wish.lengthSq() > 0.01 ? 1.6 : 1.1, dt));     // gentle acceleration, gliding stop
  player.pos.addScaledVector(player.vel, dt);
  const gy = ground(player.pos.x, player.pos.z) + 1.1;
  if (player.pos.y < gy) { player.pos.y = gy; player.vel.y = Math.max(0, player.vel.y); }
  if (player.pos.y > -1.2) { player.pos.y = -1.2; player.vel.y = Math.min(0, player.vel.y); }
  const hr = Math.hypot(player.pos.x, player.pos.z); if (hr > 125) { player.pos.x *= 125 / hr; player.pos.z *= 125 / hr; }
  camera.position.copy(player.pos); camera.position.y += Math.sin(t * 0.7) * 0.04;
  camera.rotation.set(player.pitch, player.yaw, Math.sin(t * 0.4) * 0.008 - player.vel.dot(_right) * 0.012, 'YXZ');
}

/* =====================================================================
   === 13. Cinematic tour (~30 s)
   ===================================================================== */
const tour = { active: false, t: 0, look: new V3(), captionIdx: -1 };
const CAPTIONS = [[0.6, 6, 'The Kelp Forest'], [7.4, 12.6, 'Open Water'], [15.2, 21.6, 'The Wreck'], [22.4, 25.6, 'Whale Fall'], [26.4, 29.6, 'Toward the Light']];
const captionEl = document.getElementById('caption');
function tourSample(t, outPos, outLook) {
  const N = TOUR_KEYS.length; let i = 0;
  while (i < N - 2 && t >= TOUR_KEYS[i + 1][0]) i++;
  let f = clamp((t - TOUR_KEYS[i][0]) / (TOUR_KEYS[i + 1][0] - TOUR_KEYS[i][0]), 0, 1);
  if (i === N - 2) f = Math.sin(f * Math.PI / 2);          // ease into the final wide shot
  const u = (i + f) / (N - 1);
  tourPosCurve.getPoint(u, outPos); tourLookCurve.getPoint(u, outLook);
}
function primeTourActors() {
  // choreograph a few animals so the documentary beats line up with the camera
  for (const m of world.mantas.slice(0, 1)) {
    let best = 0, bd = 1e9; const target = new V3(-12, -10, -17);
    for (let k = 0; k < 200; k++) { const d = m.curve.getPointAt(k / 200).distanceTo(target); if (d < bd) { bd = d; best = k / 200; } }
    m.u = ((best - 8.5 * m.speed / m.len) % 1 + 1) % 1; m.y = null;
  }
  const g0 = world.school.groups[0]; g0.off.set(0, 0, 0);
  world.turtle.glider.place(new V3(27, -13, -9), new V3(14, -12, 3));
}
const fadeEl = document.getElementById('fade');
function startTour() {
  const begin = () => { tour.active = true; tour.t = 0; tour.captionIdx = -1; primeTourActors(); tourSample(0, _v, tour.look); };
  document.body.classList.add('cine'); hud.classList.remove('show');
  tourSample(0, _v, _v2);
  if (camera.position.distanceTo(_v) > 15) { fadeEl.classList.add('on'); setTimeout(() => { begin(); camera.position.copy(_v); fadeEl.classList.remove('on'); }, 900); }
  else begin();
}
function endTour() {
  tour.active = false; document.body.classList.remove('cine'); captionEl.classList.remove('on');
  hud.classList.add('show');
  player.pos.copy(camera.position); player.vel.set(0, 0, 0);
  const d = camera.getWorldDirection(_v);
  player.yaw = player.tYaw = Math.atan2(-d.x, -d.z); player.pitch = player.tPitch = Math.asin(clamp(d.y, -1, 1));
  showHint();
}
const _tp = new V3(), _tl = new V3();
function updateTour(dt) {
  tour.t += dt;
  tourSample(Math.min(tour.t, TOUR_LEN), _tp, _tl);
  const gy = ground(_tp.x, _tp.z) + 2.5; if (_tp.y < gy) _tp.y = gy;
  camera.position.lerp(_tp, damp(2.2, dt));
  tour.look.lerp(_tl, damp(1.8, dt));
  camera.up.set(0, 1, 0); camera.lookAt(tour.look);
  const ci = CAPTIONS.findIndex(c => tour.t >= c[0] && tour.t < c[1]);
  if (ci !== tour.captionIdx) { tour.captionIdx = ci; if (ci >= 0) { captionEl.textContent = CAPTIONS[ci][2]; captionEl.classList.add('on'); } else captionEl.classList.remove('on'); }
  if (tour.t > TOUR_LEN + 1.2) endTour();
}

/* =====================================================================
   === 14. UI + main loop
   ===================================================================== */
const state = { started: false, manualView: false };
const hud = document.getElementById('hud'), hintEl = document.getElementById('hint'), startBtn = document.getElementById('start');
if (IS_TOUCH) document.body.classList.add('touch');
hintEl.innerHTML = IS_TOUCH ? '<b>Left stick</b> swim · <b>Drag</b> to look · <b>Up/Down</b> buttons'
  : '<b>W A S D</b> swim &nbsp;·&nbsp; <b>Drag</b> to look<br><b>Space</b> / <b>Shift</b> rise &amp; sink &nbsp;·&nbsp; <b>Esc</b> skips the tour';
let hintTimer = 0;
function showHint() { hintEl.classList.remove('fade'); clearTimeout(hintTimer); hintTimer = setTimeout(fadeHint, 9000); }
function fadeHint() { clearTimeout(hintTimer); hintTimer = setTimeout(() => hintEl.classList.add('fade'), 2500); }
startBtn.addEventListener('click', () => {
  Sound.start(); state.started = true;
  document.getElementById('title').classList.add('hide');
  startTour();
});
document.getElementById('tourBtn').addEventListener('click', () => startTour());
document.getElementById('skip').addEventListener('click', () => endTour());
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => { Sound.setMuted(!Sound.muted); soundBtn.textContent = Sound.muted ? 'Sound: Off' : 'Sound: On'; });

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  world.pointScale.value = innerHeight * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener('resize', onResize);

// adaptive quality: watch frame rate and step down resolution / shadows / density if needed
const perf = { acc: 0, n: 0, level: 0 };
const fpsEl = document.getElementById('fps'); if (DEBUG) fpsEl.style.display = 'block';
function degrade() {
  perf.level++;
  if (perf.level === 1) renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() * 0.75));
  else if (perf.level === 2) sun.castShadow = false;
  else if (perf.level === 3) { renderer.setPixelRatio(Math.max(0.75, renderer.getPixelRatio() * 0.8)); world.kelp.forEach(k => k.count = Math.floor(k.count * 0.65)); world.snow.geometry.setDrawRange(0, Math.floor(Q.snow * 0.5)); }
  onResize();
}

const clock = new THREE.Clock(); let time = 0;
const _shadowFocus = new V3();
function frame() {
  const raw = clock.getDelta(), dt = Math.min(raw, 1 / 20);
  time += dt; U.uTime.value = time;
  if (!state.started && !state.manualView) {     // title shot: slow drift above the kelp canopy
    camera.position.set(-44 + Math.sin(time * 0.07) * 1.5, -3.2 + Math.sin(time * 0.11) * 0.3, -66 + Math.cos(time * 0.06) * 1.5);
    tour.look.set(-30 + Math.sin(time * 0.05) * 3, -12, -44); camera.lookAt(tour.look);
  } else if (tour.active) updateTour(dt);
  else if (state.started) updatePlayer(dt, time);
  const cam = camera.position;
  updateLife(dt, time, cam);
  updateBubbles(dt, time);
  // shadows follow the view (texel-snapped to avoid shimmer)
  camera.getWorldDirection(_v); _shadowFocus.copy(cam).addScaledVector(_v, 18); _shadowFocus.x = Math.round(_shadowFocus.x); _shadowFocus.z = Math.round(_shadowFocus.z); _shadowFocus.y = ground(_shadowFocus.x, _shadowFocus.z);
  sun.target.position.copy(_shadowFocus); sun.position.copy(_shadowFocus).addScaledVector(SUN_DIR, 70); sun.target.updateMatrixWorld();
  world.dome.position.copy(cam);
  world.dome.material.uniforms.uDepthF.value = clamp(1 + cam.y / 30, 0.3, 1);
  // LOD: fine wreck detail only near the wreck
  const dW = cam.distanceTo(world.wreck.center); world.wreck.detail.forEach(d => d.visible = dW < 75);
  Sound.nearWreck = clamp(1 - dW / 30, 0, 1);
  renderer.render(scene, camera);
  // perf monitor
  if (raw < 0.5 && !document.hidden) { perf.acc += raw; perf.n++; }
  if (perf.acc > 3) {
    const fps = perf.n / perf.acc; perf.acc = 0; perf.n = 0;
    if (DEBUG) fpsEl.textContent = `${fps.toFixed(0)} fps  tier:${TIER}  lvl:${perf.level}  pr:${renderer.getPixelRatio().toFixed(2)}\ncalls:${renderer.info.render.calls}  tris:${(renderer.info.render.triangles / 1000).toFixed(0)}k`;
    if (fps < 40 && perf.level < 3 && time > 5 && !params.has('noadapt')) degrade();
  }
}

function init() {
  const t0 = performance.now();
  world.pointScale = { value: 1 };
  buildDome(); buildTerrain(); buildRocks(); buildKelp(); buildCoral(); buildWreck(); finishCoral(); buildWhale();
  buildLife(); buildTrail(); buildBubbles(); buildShafts(); buildSnow();
  onResize();
  world.buildMs = Math.round(performance.now() - t0);
  console.info(`Deep Reef: world built in ${world.buildMs} ms (tier ${TIER})`);
  renderer.setAnimationLoop(frame);
  startBtn.disabled = false; startBtn.textContent = 'Start Dive';
}
// debug / test hook
window.UW = { THREE, scene, camera, renderer, world, player, tour, startTour, endTour, ground, Sound,
  setView(px, py, pz, lx, ly, lz) { state.manualView = true; camera.position.set(px, py, pz); camera.lookAt(lx, ly, lz); },
  hideUI() { document.getElementById('title').classList.add('hide'); } };
setTimeout(() => {      // let the title paint first, then build
  try { init(); } catch (e) { console.error(e); const el = document.getElementById('err'); el.style.display = 'flex'; el.textContent = 'Something went wrong while building the scene: ' + e.message; }
}, 30);
</script>
</body>
